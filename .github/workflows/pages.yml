# Disposable POC workflow — see POC-NOTES.md.
#
# Builds and deploys the Jekyll site to GitHub Pages, resizing/compressing
# anything uploaded through the Decap CMS media picker (img/uploads/) before
# the build. The resize only touches the checked-out copy on the runner —
# nothing is ever committed back to the repo.
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs so a
# production deployment always completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resize and compress CMS-uploaded images
        # Shrinks anything in img/uploads/ to a 1920px long edge and
        # re-compresses it, so a shop owner can upload a huge phone photo
        # without thinking about file size. Only the runner's working copy
        # is touched — the repo itself is never modified.
        run: |
          set -e
          if ! command -v mogrify >/dev/null 2>&1; then
            echo "mogrify not found on this runner image, installing imagemagick..."
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          if [ -d "img/uploads" ]; then
            find img/uploads -type f \( \
                -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \
              \) -print0 \
              | xargs -0 --no-run-if-empty mogrify -resize '1920x1920>' -quality 75
          else
            echo "No img/uploads directory yet, skipping resize."
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # Uses the repo's own Gemfile (github-pages gem), matching the live
        # site's Jekyll/plugin versions.
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
