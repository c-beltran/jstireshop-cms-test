# Decap CMS admin config for the jstireshop-cms-test POC (throwaway).
#
# Backend: DecapBridge (https://decapbridge.com) — a hosted auth service for
# Decap CMS, so the shop owner logs in with email/password (or Google /
# Microsoft) instead of needing a GitHub account. The block below is the exact
# snippet DecapBridge generated for this site on 2026-09-20; the site id is not
# a secret (it ships in this public config). The GitHub token DecapBridge uses
# lives only in the DecapBridge dashboard, never in this repo.
backend:
  name: git-gateway
  repo: c-beltran/jstireshop-cms-test
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/71fcfdd2-3899-42e2-ab2b-8d94b82b4918/pkce
  auth_token_endpoint: /sites/71fcfdd2-3899-42e2-ab2b-8d94b82b4918/token
  gateway_url: https://gateway.decapbridge.com

  # Record who made each change in the commit message.
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# PKCE identity claims (per DecapBridge's snippet).
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# UI language for the CMS admin screen (buttons, labels, dialogs). The full
# decap-cms.js bundle used in admin/index.html registers all locales, so no
# extra script is needed beyond this key.
locale: "es"

site_url: https://c-beltran.github.io/jstireshop-cms-test/
display_url: https://c-beltran.github.io/jstireshop-cms-test/

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "home"
    label: "Página de Inicio"
    description: "Fotos y video que aparecen en la página principal del sitio."
    files:
      - name: "home"
        label: "Fotos y video de la Página de Inicio"
        file: "_data/home.yml"
        # The default preview pane just lists raw fields and broken images —
        # more confusing than helpful for a non-technical owner.
        editor:
          preview: false
        fields:
          - label: "Sección de video/imagen (\"Tire Tips\")"
            name: "promo"
            widget: "object"
            hint: "Esta sección aparece justo debajo de las horas y precios en la página de inicio."
            fields:
              - label: "Título de la sección"
                name: "heading"
                widget: "string"
                default: "Tire Tips"
                hint: "El texto grande que aparece arriba de la imagen o el video."
              - label: "¿Qué quieres mostrar?"
                name: "type"
                widget: "select"
                options:
                  - { label: "Una imagen fija", value: "image" }
                  - { label: "Un video de YouTube", value: "youtube" }
                hint: "Elige \"Una imagen fija\" para mostrar una foto, o \"Un video de YouTube\" para que los visitantes puedan reproducir un video con un clic."
              - label: "Enlace del video de YouTube"
                name: "youtube_url"
                widget: "string"
                required: false
                default: ""
                hint: "Solo se usa si elegiste \"Un video de YouTube\" arriba. Copia y pega el enlace completo, por ejemplo: https://www.youtube.com/watch?v=XXXXXXXXXXX"
              - label: "Imagen"
                name: "image"
                widget: "image"
                required: false
                hint: "Solo se usa si elegiste \"Una imagen fija\" arriba. Sube una foto nueva o elige una existente. Se redimensiona automáticamente al publicar."
              - label: "Descripción de la imagen/video (accesibilidad)"
                name: "alt"
                widget: "string"
                hint: "Describe en pocas palabras qué se ve en la imagen o el video. Ayuda a personas con discapacidad visual y mejora el posicionamiento en Google."
          - label: "Galería de 4 fotos"
            name: "gallery"
            widget: "list"
            label_singular: "foto"
            minimize_collapsed: false
            collapsed: false
            summary: "{{fields.alt}}"
            hint: "Las 4 fotos que aparecen en fila más abajo en la página de inicio. Debe haber exactamente 4."
            fields:
              - label: "Foto"
                name: "image"
                widget: "image"
                hint: "Se redimensiona automáticamente al publicar (máximo 1920px de ancho/alto)."
              - label: "Descripción de la foto (accesibilidad)"
                name: "alt"
                widget: "string"
                hint: "Describe en pocas palabras qué se ve en la foto."
